plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.pavo.nearby'
version = '0.1.0'

android {
  namespace "org.pavo.nearby"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}
